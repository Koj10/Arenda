# PropCount production — propcount.ru / 77.91.100.153:3001
server {
    listen 80;
    server_name propcount.ru www.propcount.ru 77.91.100.153 _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Landing (static)
    location / {
        try_files $uri $uri/ =404;
    }

    # Vue panel SPA under /panel/
    location = /panel {
        return 301 /panel/;
    }

    location /panel/ {
        try_files $uri $uri/ /panel/index.html;
    }

    # Cache hashed assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # No cache for HTML
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
