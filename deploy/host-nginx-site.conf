# Только сайт. API уже в /etc/nginx/sites-enabled/api.propcount — не копируйте его сюда.
#
#   propcount.ru / www → TLS на хосте, контент Docker :3005 (compose: "3005:80")
#
#   sudo cp deploy/host-nginx-site.conf /etc/nginx/sites-available/propcount.ru
#   sudo ln -sf /etc/nginx/sites-available/propcount.ru /etc/nginx/sites-enabled/propcount.ru
#   sudo nginx -t && sudo systemctl reload nginx
#   docker compose ps   # должен быть 0.0.0.0:3005->80
#   curl -sI http://127.0.0.1:3005/login

server {
    listen 80;
    listen [::]:80;
    server_name propcount.ru www.propcount.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://propcount.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.propcount.ru;

    ssl_certificate     /etc/letsencrypt/live/propcount.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propcount.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://propcount.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name propcount.ru;

    ssl_certificate     /etc/letsencrypt/live/propcount.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propcount.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Иначе POST /__api/files отсекается дефолтом nginx (1m) ещё до Docker.
    client_max_body_size 50m;
    client_body_timeout 120s;

    location /__api/ {
        client_max_body_size 50m;
        client_body_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name api.propcount.ru;
        proxy_set_header Host api.propcount.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_pass https://api.propcount.ru/;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
