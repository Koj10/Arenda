# Только сайт. API уже в /etc/nginx/sites-enabled/api.propcount — не копируйте его сюда.
#
#   propcount.ru / www → Docker :3005
#
# На сервере:
#   sudo cp deploy/host-nginx-site.conf /etc/nginx/sites-available/propcount.ru
#   sudo ln -sf /etc/nginx/sites-available/propcount.ru /etc/nginx/sites-enabled/propcount.ru
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Если сертификата ещё нет:
#   sudo certbot --nginx -d propcount.ru -d www.propcount.ru

server {
    listen 80;
    listen [::]:80;
    server_name propcount.ru www.propcount.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://propcount.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.propcount.ru;

    ssl_certificate     /etc/letsencrypt/live/propcount.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propcount.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://propcount.ru$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name propcount.ru;

    ssl_certificate     /etc/letsencrypt/live/propcount.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propcount.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
