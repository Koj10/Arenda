# Не копируйте этот файл как весь сайт.
# Он забирает 443 и проксирует страницы на :3005 → 502 на /login и /register.
#
# Вернуть вход и регистрацию:
#
#   sudo rm -f /etc/nginx/sites-enabled/propcount.ru
#   sudo nginx -t && sudo systemctl reload nginx
#   docker compose up -d
#   curl -sI https://propcount.ru/login
#   curl -sI https://propcount.ru/register
#
# /__api на прямую к API (вставить внутрь вашего server { listen 443; }, только если
# Docker не слушает 443). См. deploy/host-api-location.conf
