# TLS на хосте. Страницы с диска /var/www/propcount — без прокси на Docker.
# /__api → https://api.propcount.ru
#
# Разово скопировать файлы из контейнера (или из репозитория landing/ + panel/dist):
#   sudo mkdir -p /var/www/propcount
#   sudo docker cp "$(docker compose ps -q app)":/usr/share/nginx/html/. /var/www/propcount/
#   sudo cp deploy/host-nginx-site.conf /etc/nginx/sites-available/propcount.ru
#   sudo ln -sf /etc/nginx/sites-available/propcount.ru /etc/nginx/sites-enabled/propcount.ru
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -sI https://propcount.ru/login

server {
    listen 80;
    listen [::]:80;
    server_name propcount.ru www.propcount.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://propcount.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.propcount.ru;

    ssl_certificate     /etc/letsencrypt/live/propcount.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propcount.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://propcount.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name propcount.ru;

    ssl_certificate     /etc/letsencrypt/live/propcount.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propcount.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;
    client_body_timeout 120s;

    root /var/www/propcount;
    index index.html;
    absolute_redirect off;

    location /__api/ {
        client_max_body_size 50m;
        client_body_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name api.propcount.ru;
        proxy_set_header Host api.propcount.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_pass https://api.propcount.ru/;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html { return 301 /; }
    location = /login.html { return 301 /login; }
    location = /register.html { return 301 /register; }
    location = /verify-email.html { return 301 /verify-email; }
    location = /forgot-password.html { return 301 /forgot-password; }
    location = /reset-password.html { return 301 /reset-password; }
    location = /invite.html { return 301 /invite; }
    location = /privacy.html { return 301 /privacy; }
    location = /terms.html { return 301 /terms; }

    location = /login { try_files /login.html =404; }
    location = /register { try_files /register.html =404; }
    location = /verify-email { try_files /verify-email.html =404; }
    location = /forgot-password { try_files /forgot-password.html =404; }
    location = /reset-password { try_files /reset-password.html =404; }
    location = /invite { try_files /invite.html =404; }
    location = /privacy { try_files /privacy.html =404; }
    location = /terms { try_files /terms.html =404; }

    location = /favicon.ico {
        try_files /favicon.png /favicon.svg =404;
    }

    location = /panel { return 301 /panel/; }
    location /panel/ {
        try_files $uri $uri/ /panel/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
