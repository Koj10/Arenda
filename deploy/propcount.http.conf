server {
    listen 80;
    server_name propcount.ru www.propcount.ru 94.228.166.142 _;

    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # Сохраняем порт из Host (нужно для :3001)
    absolute_redirect off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/api-locations.conf;

    # Главная: отдаём файл напрямую, без редиректа через /index.html
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /;
    }

    location = /login.html {
        return 301 /login;
    }
    location = /register.html {
        return 301 /register;
    }
    location = /verify-email.html {
        return 301 /verify-email;
    }
    location = /forgot-password.html {
        return 301 /forgot-password;
    }
    location = /reset-password.html {
        return 301 /reset-password;
    }
    location = /privacy.html {
        return 301 /privacy;
    }
    location = /terms.html {
        return 301 /terms;
    }

    location = /login {
        try_files /login.html =404;
    }
    location = /register {
        try_files /register.html =404;
    }
    location = /verify-email {
        try_files /verify-email.html =404;
    }
    location = /forgot-password {
        try_files /forgot-password.html =404;
    }
    location = /reset-password {
        try_files /reset-password.html =404;
    }
    location = /privacy {
        try_files /privacy.html =404;
    }
    location = /terms {
        try_files /terms.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /panel {
        return 301 /panel/;
    }

    location /panel/ {
        try_files $uri $uri/ /panel/index.html;
    }
}
