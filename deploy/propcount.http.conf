server {
    listen 80;
    server_name propcount.ru www.propcount.ru 77.91.100.153 _;

    root /usr/share/nginx/html;
    index index.html;

    # Сохраняем порт из Host (нужно для :3001)
    absolute_redirect off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Главная: отдаём файл напрямую, без редиректа через /index.html
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /;
    }

    location = /login.html {
        return 301 /login;
    }
    location = /register.html {
        return 301 /register;
    }

    location = /login {
        try_files /login.html =404;
    }
    location = /register {
        try_files /register.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /panel {
        return 301 /panel/;
    }

    location /panel/ {
        try_files $uri $uri/ /panel/index.html;
    }
}
