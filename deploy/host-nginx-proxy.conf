# Хостовый nginx (прокси на Docker :3001).
# После certbot SSL уже в /etc/nginx/sites-enabled/propcount.ru —
# в HTTPS server для propcount.ru оставь proxy_pass на :3001.
# Чистые URL обрабатывает nginx в контейнере (после деплоя нового образа).

server {
    listen 80;
    server_name propcount.ru www.propcount.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://propcount.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.propcount.ru;

    ssl_certificate     /etc/letsencrypt/live/propcount.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propcount.ru/privkey.pem;

    return 301 https://propcount.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name propcount.ru;

    ssl_certificate     /etc/letsencrypt/live/propcount.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propcount.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
