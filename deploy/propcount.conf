upstream propcount_api {
    server api:3000;
}

# --- HTTP: ACME + редирект на HTTPS ---
server {
    listen 80;
    server_name propcount.ru www.propcount.ru 77.91.100.153;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://propcount.ru$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.propcount.ru;

    ssl_certificate     /etc/letsencrypt/live/propcount.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propcount.ru/privkey.pem;

    return 301 https://propcount.ru$request_uri;
}

# --- HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name propcount.ru;

    ssl_certificate     /etc/letsencrypt/live/propcount.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propcount.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://propcount_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        proxy_pass http://propcount_api/health;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /panel {
        return 301 /panel/;
    }

    location /panel/ {
        try_files $uri $uri/ /panel/index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
