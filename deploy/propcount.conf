server {
    listen 80;
    server_name propcount.ru www.propcount.ru 77.91.100.153;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://propcount.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.propcount.ru;

    ssl_certificate     /etc/letsencrypt/live/propcount.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propcount.ru/privkey.pem;

    return 301 https://propcount.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name propcount.ru;

    ssl_certificate     /etc/letsencrypt/live/propcount.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propcount.ru/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    include /etc/nginx/snippets/api-locations.conf;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /;
    }

    location = /login.html {
        return 301 /login;
    }
    location = /register.html {
        return 301 /register;
    }
    location = /privacy.html {
        return 301 /privacy;
    }
    location = /terms.html {
        return 301 /terms;
    }

    location = /login {
        try_files /login.html =404;
    }
    location = /register {
        try_files /register.html =404;
    }
    location = /privacy {
        try_files /privacy.html =404;
    }
    location = /terms {
        try_files /terms.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /panel {
        return 301 /panel/;
    }

    location /panel/ {
        try_files $uri $uri/ /panel/index.html;
    }
}
