# Браузер → /__api/... → https://api.propcount.ru/...
# Лимит здесь обязателен: иначе действует дефолт 1m и 413 на файлах чуть больше мегабайта.

location /__api/ {
    client_max_body_size 50m;
    client_body_timeout 120s;
    include /etc/nginx/snippets/api-proxy.conf;
    proxy_pass https://api.propcount.ru/;
}
