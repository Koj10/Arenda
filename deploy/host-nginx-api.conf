# API: api.propcount.ru → Docker/uvicorn на :3001
#
#   sudo cp deploy/host-nginx-api.conf /etc/nginx/sites-available/api.propcount.ru
#   sudo ln -sf /etc/nginx/sites-available/api.propcount.ru /etc/nginx/sites-enabled/api.propcount.ru
#   sudo certbot --nginx -d api.propcount.ru
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.propcount.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://api.propcount.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.propcount.ru;

    ssl_certificate     /etc/letsencrypt/live/api.propcount.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.propcount.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
