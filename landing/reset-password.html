<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новый пароль — PropCount</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body class="auth-body">

  <main class="auth-shell auth-shell--wide">
    <a href="/" class="auth-logo">
      <img src="assets/logo.png" alt="" width="36" height="36" />
      <span>PropCount</span>
    </a>

    <div class="auth-card">
      <h1 class="auth-title">Новый пароль</h1>
      <p class="auth-subtitle">Введите код из письма и придумайте новый пароль.</p>

      <form id="reset-password-form" novalidate class="auth-form">
        <div class="field-group">
          <div class="field-control">
            <i data-feather="mail" class="field-icon"></i>
            <input id="email" type="email" class="field-input" placeholder="Email" autocomplete="email" required />
          </div>
          <p class="field-error"></p>
        </div>

        <div class="field-group">
          <div class="field-control">
            <i data-feather="key" class="field-icon"></i>
            <input
              id="code"
              type="text"
              class="field-input field-input--code"
              placeholder="Код из письма"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="8"
              required
            />
          </div>
          <p class="field-error"></p>
        </div>

        <div class="field-group">
          <div class="field-control">
            <i data-feather="lock" class="field-icon"></i>
            <input id="password" type="password" class="field-input" placeholder="Новый пароль" autocomplete="new-password" required />
            <button type="button" data-toggle-password class="field-toggle" aria-label="Показать пароль">
              <i data-feather="eye"></i>
            </button>
          </div>
          <div class="strength-bar"><div class="strength-fill"></div></div>
          <p class="strength-label"></p>
          <p class="field-error"></p>
        </div>

        <div class="field-group">
          <div class="field-control">
            <i data-feather="lock" class="field-icon"></i>
            <input id="password-confirm" type="password" class="field-input" placeholder="Подтверждение пароля" autocomplete="new-password" required />
          </div>
          <p class="field-error"></p>
        </div>

        <button type="submit" class="btn-primary">Сохранить пароль</button>
      </form>

      <p class="auth-footer-text">
        Нет кода?
        <a href="/forgot-password" class="auth-link auth-link--bold">Отправить ещё раз</a>
      </p>
    </div>

    <p class="auth-back"><a href="/login">← Ко входу</a></p>
  </main>

  <script src="https://unpkg.com/feather-icons"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
