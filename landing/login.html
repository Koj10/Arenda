<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — PropCount</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body class="auth-body">

  <main class="auth-shell">
    <a href="/" class="auth-logo">
      <img src="assets/logo.png" alt="" width="36" height="36" />
      <span>PropCount</span>
    </a>

    <div class="auth-card">
      <h1 class="auth-title">Добро пожаловать обратно</h1>
      <p class="auth-subtitle">Выберите панель: арендодатель или арендатор</p>

      <form id="login-form" novalidate class="auth-form">
        <fieldset class="role-pick">
          <legend class="role-pick-legend">Кто вы</legend>
          <label class="role-pick-card">
            <input type="radio" name="role" value="landlord" required />
            <span class="role-pick-title">Арендодатель</span>
            <span class="role-pick-desc">Объекты, арендаторы, счета и аналитика</span>
          </label>
          <label class="role-pick-card">
            <input type="radio" name="role" value="tenant" />
            <span class="role-pick-title">Арендатор</span>
            <span class="role-pick-desc">Помещения, входящие счета и отчёты</span>
          </label>
        </fieldset>
        <p class="field-error" data-role-error></p>
        <div class="field-group">
          <div class="field-control">
            <i data-feather="mail" class="field-icon"></i>
            <input id="email" type="email" class="field-input" placeholder="Email" autocomplete="email" required />
          </div>
          <p class="field-error"></p>
        </div>

        <div class="field-group">
          <div class="field-control">
            <i data-feather="lock" class="field-icon"></i>
            <input id="password" type="password" class="field-input" placeholder="Пароль" autocomplete="current-password" required />
            <button type="button" data-toggle-password class="field-toggle" aria-label="Показать пароль">
              <i data-feather="eye"></i>
            </button>
          </div>
          <p class="field-error"></p>
        </div>

        <div class="auth-row">
          <label class="auth-checkbox-label">
            <input type="checkbox" />
            <span>Запомнить меня</span>
          </label>
          <a href="#" class="auth-link" data-forgot-password>Забыли пароль?</a>
        </div>

        <button type="submit" class="btn-primary">Войти</button>
      </form>

      <div class="auth-divider"><span>Или продолжайте с</span></div>

      <div class="auth-oauth">
        <button type="button" class="auth-oauth-btn" data-oauth="google">Google</button>
        <button type="button" class="auth-oauth-btn" data-oauth="apple">Apple</button>
      </div>

      <p class="auth-footer-text">
        Нет аккаунта?
        <a href="/register" class="auth-link auth-link--bold">Зарегистрироваться</a>
      </p>
    </div>

    <p class="auth-back"><a href="/">← На главную</a></p>
  </main>

  <script src="https://unpkg.com/feather-icons"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
