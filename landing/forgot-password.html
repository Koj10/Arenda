<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Восстановление пароля — PropCount</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <link href="css/styles.css?v=6" rel="stylesheet" />
</head>
<body class="auth-body">

  <main class="auth-shell">
    <a href="/" class="auth-logo">
      <img src="assets/logo.png" alt="" width="36" height="36" />
      <span>PropCount</span>
    </a>

    <div class="auth-card">
      <h1 class="auth-title">Забыли пароль?</h1>
      <p class="auth-subtitle">Укажите email — отправим код для смены пароля.</p>

      <form id="forgot-password-form" novalidate class="auth-form">
        <div class="field-group">
          <div class="field-control">
            <i data-feather="mail" class="field-icon"></i>
            <input name="email" type="email" class="field-input" placeholder="Email" autocomplete="email" required />
          </div>
          <p class="field-error"></p>
        </div>

        <button type="submit" class="btn-primary">Отправить код</button>
      </form>

      <p class="auth-footer-text">
        Вспомнили пароль?
        <a href="/login" class="auth-link auth-link--bold">Войти</a>
      </p>
    </div>

    <p class="auth-back"><a href="/">← На главную</a></p>
  </main>

  <script src="https://unpkg.com/feather-icons"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js?v=6"></script>
</body>
</html>
