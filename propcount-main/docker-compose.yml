services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - /data/databases/falbue/test/postgres:/var/lib/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - storage_data:/app/storage
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - IN_DOCKER=1

volumes:
  pgdata:
  storage_data:
