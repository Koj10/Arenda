name: Сборка и публикация

# Важно: для push tags GitHub берёт workflow из КОММИТА, на который указывает тег.
# Тегайте актуальный main/master, где есть этот файл.
on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Версия образа (например 1.0.4). Пусто = latest + run id"
        required: false
        default: ""

jobs:
  check-tags:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Определение версии
        id: version
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            if [[ -n "${INPUT_TAG}" ]]; then
              TAG_NAME="${INPUT_TAG}"
            else
              TAG_NAME="manual-${GITHUB_RUN_ID}"
            fi
          else
            TAG_NAME=""
          fi

          if [[ -z "${TAG_NAME}" ]]; then
            echo "tag=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          # Релиз GitHub: теги вида 1.0.0 / v1.0.0 (не больше 3 сегментов)
          PLAIN="${TAG_NAME#v}"
          SEGMENTS=$(echo "${PLAIN}" | tr '.' '\n' | grep -c . || true)
          if [[ "${SEGMENTS}" -ge 1 && "${SEGMENTS}" -le 3 ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Resolved tag=${TAG_NAME} release segments=${SEGMENTS}"

  build:
    needs: check-tags
    if: needs.check-tags.outputs.tag != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Имена образов
        id: image
        run: |
          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "web=$BASE" >> "$GITHUB_OUTPUT"
          echo "api=${BASE}-api" >> "$GITHUB_OUTPUT"

      - name: Сборка web (лендинг + панель + nginx)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.web }}:${{ needs.check-tags.outputs.tag }}
            ${{ steps.image.outputs.web }}:latest

      - name: Сборка api (FastAPI / propcount-main)
        uses: docker/build-push-action@v5
        with:
          context: ./propcount-main
          file: ./propcount-main/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.api }}:${{ needs.check-tags.outputs.tag }}
            ${{ steps.image.outputs.api }}:latest

  create-release:
    runs-on: ubuntu-latest
    needs: check-tags
    if: needs.check-tags.outputs.release == 'true' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Создание релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-tags.outputs.tag }}
          name: Релиз ${{ needs.check-tags.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
