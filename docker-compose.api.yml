# FastAPI на сервере. Сайт уже в docker-compose.yml (:3005).
# API снаружи: https://api.propcount.ru → nginx → 127.0.0.1:3001
#
#   docker compose -f docker-compose.api.yml pull
#   docker compose -f docker-compose.api.yml up -d
#
# Локальная сборка без GHCR:
#   docker compose -f docker-compose.api.yml up -d --build

name: PropCountAPI

services:
  api:
    image: ghcr.io/koj10/arenda-api:${TAG:-latest}
    build:
      context: ./propcount-main
      dockerfile: Dockerfile
    ports:
      - "3001:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      CORS_ORIGINS: https://propcount.ru,https://www.propcount.ru
    volumes:
      - api_storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  api_storage:
